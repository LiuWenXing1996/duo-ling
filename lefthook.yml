# Git hooks 配置（lefthook）——挂了什么、怎么跳过，见 GIT_HOOKS.md
pre-commit:
  jobs:
    - name: check:comments
      run: pnpm run check:comments
    - name: secretlint
      # 不列扩展名白名单：漏一个类型就是静默放行（env 文件、pem 证书、无扩展名配置都曾不在名单里）。
      # 四组都要写：`**` 至少吞一层目录，只写 `**/*` 会漏掉仓库根文件；且默认不匹配 dotfiles。
      glob:
        - "*"
        - ".*"
        - "**/*"
        - "**/.*"
      run: pnpm exec secretlint {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: pnpm run test
