# 工作区成员：gm-runtime 是把 Violentmonkey 的 GM 运行时产出成产物的内部包
# （private、不发布 registry；vendored 的 VM 源码在它自己的 .gitignore 里，不受这里影响）。
packages:
  - 'packages/*'

# pnpm 会拦截依赖的构建脚本（postinstall 等），这里显式登记放行与否。
# vue-demi 的 postinstall 只按装到的 Vue 版本切换入口文件，而它发版时的默认入口就是
# Vue 3 版本（lib/index.cjs / index.mjs / index.d.ts 与 lib/v3/ 逐字节相同），跳过无影响。
allowBuilds:
  vue-demi: false
