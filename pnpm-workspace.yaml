# pnpm 工作区配置（pnpm 11）
# 说明：pnpm 11 从 pnpm-workspace.yaml 读取配置，.npmrc 中仅保留 auth/registry 设置

# 单项目：声明为空工作区，仅用于承载全局 pnpm 配置
# 避免 pnpm add 在 workspace root 报错（packages field missing）
packages: []

# 使用 hoisted 布局，确保 Electron 及其原生依赖在 node_modules 根目录可被正确解析
nodeLinker: hoisted

# 允许以下包执行构建脚本（否则 electron 二进制不会被下载、esbuild 等原生包不可用）
allowBuilds:
  electron: true
  esbuild: true
  vue-demi: true
  electron-winstaller: true
  '@tailwindcss/oxide': true
  oxc-resolver: true

minimumReleaseAgeExclude:
  - '@lucide/vue@1.33.0'

# 只安装当前平台（macOS arm64）的原生依赖，避免拉取其他平台的 optionalDependencies
# 若之后在 mac 上交叉打包 win/linux，需临时放开或按目标平台设定。
supportedArchitectures:
  os:
    - darwin
  cpu:
    - arm64
