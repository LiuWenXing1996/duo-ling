<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>哆灵</title>
    <!--
      首帧加载态（内联，零外部依赖）。为什么必须内联，见 README「关键坑与规避」坑 11：
        扩展页 CSP 禁内联 <script>，主题类 .dark 只能等 JS 执行才挂上；而入口静态图（modulepreload
        那几百 KB）执行完前页面没有任何背景色 —— 系统是深色时先看到一片刺眼纯白。
        这里让「JS 未执行完」的窗口直接呈现「正确的底色 + 一个转圈」。Vue mount 会清空 #app，
        加载态随之消失，无需 JS 移除（这段样式在元素消失后即无作用目标）。
      两个关键约束，改动时别丢：
        1) .dl-boot 必须自带背景。CSS 到达后 body 会取 --background 的 :root 值（浅色），
           只给 html 设底色会被 body 遮住、照样是白，所以这一层要整块盖住它。
        2) 转圈只能用纯 CSS 画。SVG / 图标库 / Tailwind 的 animate-spin 都要求 JS 或外部 CSS 已就绪，
           在这一档全都不成立。
      下列布局基线与颜色取值均与 assets/main.css 同值，不会与正式样式互相覆盖。
    -->
    <style>
      /* 首帧底色用 CSS 系统色 Canvas，自动跟随系统深浅色 —— 不依赖 @media (prefers-color-scheme)，
         因为 Chrome 在部分环境下该媒体查询不可靠（文档未正确上报深色），会让内联样式走 light 分支变白。
         Canvas/CanvasText 由浏览器按 OS 配色直接解析，稳定且不需 JS（CSP 禁内联脚本）。 */
      html {
        background: Canvas;
      }
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
      }

      .dl-boot {
        /* position:fixed + inset:0 钉死整个视口，不依赖 #app/body 的高度链路 */
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: Canvas;
      }
      .dl-boot::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, CanvasText 15%, Canvas);
        border-top-color: CanvasText;
        border-radius: 50%;
      }

      /* 关掉动效偏好时不转，但保留静态圆环：轨道 + 一段高亮仍能读作「加载中」 */
      @media (prefers-reduced-motion: no-preference) {
        .dl-boot::after {
          animation: dl-spin 0.7s linear infinite;
        }
        @keyframes dl-spin {
          to {
            transform: rotate(360deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="dl-boot" role="status" aria-label="加载中"></div>
    </div>
    <script type="module" src="./app/floatpanel-main.ts"></script>
  </body>
</html>
