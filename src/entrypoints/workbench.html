<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>哆灵工作台</title>
    <!--
      首帧加载态（内联，零外部依赖）。说明与两个关键约束见 floatpanel.html 的同一段注释，
      两处必须保持一致（同值是为了不跟 assets/main.css 打架，改一处就要改另一处）。
      Vue mount 会清空 #app，加载态随之消失，无需 JS 移除。
    -->
    <style>
      /* 首帧底色用 CSS 系统色 Canvas，自动跟随系统深浅色 —— 不依赖 @media (prefers-color-scheme)，
         因为 Chrome 在部分环境下该媒体查询不可靠（文档未正确上报深色），会导致内联样式走 light 分支变白。
         Canvas/CanvasText 由浏览器按 OS 配色直接解析，稳定且不需 JS（CSP 禁内联脚本）。 */
      html {
        background: Canvas;
      }
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
      }

      .dl-boot {
        /* position:fixed + inset:0 钉死整个视口，不依赖 #app/body 的高度链路 */
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: Canvas;
      }
      .dl-boot::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid color-mix(in srgb, CanvasText 15%, Canvas);
        border-top-color: CanvasText;
        border-radius: 50%;
      }

      @media (prefers-reduced-motion: no-preference) {
        .dl-boot::after {
          animation: dl-spin 0.7s linear infinite;
        }
        @keyframes dl-spin {
          to {
            transform: rotate(360deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="dl-boot" role="status" aria-label="加载中"></div>
    </div>
    <script type="module" src="./app/workbench-main.ts"></script>
  </body>
</html>
