name: release

# 合 main 后由 CI 补打 tag：
# 版本号由人在本地用 `npm run release` 决定，随「专门的 release PR」合入 main；
# 本 workflow 在 release PR 合入后读取合并 commit 的 package.json version，
# 若该版本 tag 不存在则打 annotated tag 并推送到 refs/tags/*。
# 设计前提：main 分支保护禁止对分支直接 push（含 CI token），
# 但 refs/tags/* 不在该 ruleset 约束内，故 CI 仅推 tag、不碰分支。

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

# 串行，防止两个 release PR 同时合入抢建同一 tag。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # PR 合入 main，或手动 Run workflow 时执行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # runner 默认没有 git identity，annotated tag（git tag -a）会报 empty ident 而失败。
      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Tag and push
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "release version: ${VERSION} -> ${TAG}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在（本次非发版 PR 或已发过），跳过。"
            exit 0
          fi
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          echo "已推送 tag $TAG"
