name: release

# 合 main 自动发版：PR 合入 main 后，按 PR 上的 release label 自动 bump + 打 tag + 推送。
# 预发布（alpha/beta/rc）与稳定版共用同一套 bump 规则；每个 PR 一个版本。
#
# 前提：main 分支保护需允许本 workflow 的 GITHUB_TOKEN 推送（或在分支保护中将此 token 加入豁免）。
# 若推送被保护规则拦截，release 脚本已在本地完成 commit + 打 tag，按失败提示手动 git push 收尾即可。
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch | minor | major'
        required: true
        default: 'patch'
      pre:
        description: '预发布 stage：alpha | beta | rc（留空 = 稳定版）'
        required: false

permissions:
  contents: write

# 串行，避免两个 PR 接连合入时读同一版本号撞 tag。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve release args from trigger
        id: rel
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_BUMP: ${{ github.event.inputs.bump }}
          DISPATCH_PRE: ${{ github.event.inputs.pre }}
        run: |
          ARGS=$(node -e '
            const labels = JSON.parse(process.env.LABELS || "[]");
            const rel = labels.find(l => l.startsWith("release:"));
            const pre = labels.find(l => l.startsWith("pre:"));
            let args = "";
            if (rel) {
              const p = rel.split(":");
              const bump = p[1];
              const stage = p[3];
              args = bump + (stage ? " --pre " + stage : "");
            } else if (pre) {
              args = "--pre " + pre.split(":")[1];
            } else if (process.env.DISPATCH_BUMP) {
              args = process.env.DISPATCH_BUMP +
                (process.env.DISPATCH_PRE ? " --pre " + process.env.DISPATCH_PRE : "");
            }
            process.stdout.write(args);
          ')
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "resolved args: $ARGS"

      - name: Release
        if: steps.rel.outputs.args != ''
        run: npm run release -- ${{ steps.rel.outputs.args }} --push

      - name: Skip notice
        if: steps.rel.outputs.args == ''
        run: echo "无 release label（且非手动触发），跳过发版，仅合代码。"
