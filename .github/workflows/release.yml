name: release

# 合 main 后由 CI 自动发版：
# 版本号由人在本地用 `npm run release` 决定，随「专门的 release PR」合入 main；
# 本 workflow 在 release PR 合入后读取合并 commit 的 package.json version → vX.Y.Z，
# 打 annotated tag 并推送到 refs/tags/*（幂等：已存在则跳过），
# 同时抽取 CHANGELOG.md 对应段作为 GitHub Release notes 自动建 Release（预发布版标 --prerelease）。
# 设计前提：main 分支保护禁止对分支直接 push（含 CI token），
# 但 refs/tags/* 不在该 ruleset 约束内，故 CI 仅推 tag、不碰分支。

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

# 串行，防止两个 release PR 同时合入抢建同一 tag。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # PR 合入 main，或手动 Run workflow 时执行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # runner 默认没有 git identity，annotated tag（git tag -a）会报 empty ident 而失败。
      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "release version: ${VERSION} -> ${TAG}"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "已推送 tag $TAG"
          else
            echo "tag $TAG 已存在，跳过打 tag（本次非发版 PR 或已发过）。"
          fi

          # Release 幂等：缺失才建，已存在则更新 notes。
          # notes 由 scripts/extract-changelog.mjs 从 CHANGELOG.md 对应段抽取（预发布版标 --prerelease）。
          node scripts/extract-changelog.mjs "$TAG" > /tmp/release-notes.md
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            echo "已更新 Release $TAG 的 notes。"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md $PRERELEASE_FLAG
            echo "已创建 GitHub Release $TAG${PRERELEASE_FLAG:+（预发布）}。"
          fi
