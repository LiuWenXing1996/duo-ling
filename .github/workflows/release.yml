name: release

# 合 main 后由 CI 自动发版：
# 版本号由人在本地用 `pnpm run release` 决定，随「专门的 release PR」合入 main；
# 本 workflow 在 release PR 合入后读取合并 commit 的 package.json version → vX.Y.Z，
# 打 annotated tag 并推送到 refs/tags/*（幂等：已存在则跳过），
# 同时抽取 CHANGELOG.md 对应段作为 GitHub Release notes 自动建 Release（预发布版标 --prerelease），
# 再把构建好的 chrome-mv3 产物打包成 zip 上传为该 Release 的 asset。
# 设计前提：main 分支保护禁止对分支直接 push（含 CI token），
# 但 refs/tags/* 不在该 ruleset 约束内，故 CI 仅推 tag、不碰分支。
#
# 两个 job 的分工：
#   tag   = 发版主链路（打 tag + 建/更新 Release notes），快、无依赖，尽量少失败点。
#   build = 产物链路（构建 + 打包 + 上传 asset），独立 job 而非并入 tag：
#           构建环境偶发失败不会拖累「版本已发布」这件事——tag 与 Release notes 已先落定，
#           build 失败只需修好后手动 Run workflow 补传（tag 已存在会跳过，asset 用 --clobber 覆盖）。

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

# 串行，防止两个 release PR 同时合入抢建同一 tag。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # PR 合入 main，或手动 Run workflow 时执行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    # 供 build job 消费：tag 串（形如 v0.1.0-alpha.3）、是否「本次确属发版 / 手动兜底」。
    # upload=false 的场景（普通 PR 合入、tag 早已存在）不重建产物——避免用 main 当前代码
    # 覆盖已发布 tag 对应的那份 asset（版本号相同、内容却不同）。
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      upload: ${{ steps.release.outputs.upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      # runner 默认没有 git identity，annotated tag（git tag -a）会报 empty ident 而失败。
      - name: Configure git identity
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

      - name: Tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # 走 env 而非直接把 ${{ }} 拼进脚本：避免模板表达式内联到 shell 里。
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "release version: ${VERSION} -> ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "已推送 tag $TAG"
            NEW_RELEASE=true
          else
            echo "tag $TAG 已存在，跳过打 tag（本次非发版 PR 或已发过）。"
            NEW_RELEASE=false
          fi

          # Release 幂等：缺失才建，已存在则更新 notes。
          # notes 由 scripts/extract-changelog.mjs 从 CHANGELOG.md 对应段抽取（预发布版标 --prerelease）。
          node scripts/extract-changelog.mjs "$TAG" > /tmp/release-notes.md
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-"* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            echo "已更新 Release $TAG 的 notes。"
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md $PRERELEASE_FLAG
            echo "已创建 GitHub Release $TAG${PRERELEASE_FLAG:+（预发布）}。"
          fi

          # 产物上传开关：仅「本次新建 tag（真发版）」或「手动 Run workflow（兜底补传）」时为 true；
          # 两者都允许覆盖同名 asset（--clobber），普通 PR 合入则不碰已发布产物。
          if [[ "$NEW_RELEASE" == "true" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "非发版 PR（tag 已存在），跳过产物构建。"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

  # 产物：构建 chrome-mv3 → 打包 zip → 上传为 Release asset。
  # 只在 tag job 判定需要时执行（needs + if），普通 PR 合入会被跳过但 workflow 仍算成功。
  build:
    needs: tag
    if: needs.tag.outputs.upload == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # 不传 version：pnpm/action-setup 读 package.json 的 packageManager 字段，
      # 版本只有一处真相源，避免 workflow 与本地各写一个版本号后漂移。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .wxt/tsconfig.json 由 wxt prepare 生成，构建依赖它；显式 prepare 兜底（同 ci.yml）。
      - name: Generate WXT types (.wxt/tsconfig.json)
        run: pnpm exec wxt prepare

      # VM 运行时源码不入库（见 packages/gm-runtime/.gitignore），根 build 的第一步就是
      # gm-runtime 的 build:runtime，缺了它整条产物链路在开头就挂 —— 必须先拉。
      # 拉取配方只有 scripts/fetch-vm-runtime.mjs 一处（含钉定版本），CI 与本机共用同一份。
      - name: Fetch Violentmonkey runtime source
        run: node scripts/fetch-vm-runtime.mjs

      - name: Build chrome-mv3
        run: pnpm run build

      # zip 内容直接是扩展目录本身（含 manifest.json），解压即得可「加载已解压的扩展」的目录。
      # 文件名带 tag，避免多个版本 asset 同名冲突。
      - name: Package zip
        id: package
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          ARTIFACT="duo-ling-${TAG}-chrome-mv3.zip"
          cd .output/chrome-mv3
          zip -r "../../${ARTIFACT}" .
          cd ../..
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          ls -lh "${ARTIFACT}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.tag.outputs.tag }}" \
            "${{ steps.package.outputs.artifact }}" --clobber
          echo "已上传 ${{ steps.package.outputs.artifact }} 到 ${{ needs.tag.outputs.tag }}。"
