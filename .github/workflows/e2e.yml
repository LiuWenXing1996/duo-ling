name: E2E

# 独立 E2E workflow。
# - 手动触发（workflow_dispatch）：想在哪跑就在哪跑
# - 每日北京时间 02:00（UTC 18:00）定时跑全量冒烟，抓产品级回归（如 CSP / 注入链路）
# - push main 时跑一遍，merge 后即验证
# - pull_request 时也跑（2026-09-19 起）：E2E spec 不在 typecheck 覆盖内，命令面改动
#   只有端测能兜住（updateFiles 被删那次就是 PR 绿灯、合入 main 才红）。跑得快（~1 分钟），
#   同 PR 连推由 concurrency 自动取消旧 run，只跑最新 commit。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 构建生产产物（E2E fixture 加载 .output/chrome-mv3），同时生成 .wxt 类型
      - name: Build extension
        run: npm run build

      # 缓存 Playwright 浏览器二进制，避免每次重新下载。
      # GitHub 官方 runner 在海外，走 Playwright 官方 CDN 即可（稳定且快）；
      # 若改用国内自托管 runner，可加 env PLAYWRIGHT_DOWNLOAD_HOST=https://npmmirror.com/mirrors/playwright/
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e
