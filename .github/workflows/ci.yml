name: CI

# 快测：类型检查 + 单元测试。E2E 是独立 workflow，触发面见 e2e.yml 顶部。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支多次 push/更新 PR 时取消进行中的旧跑，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本不写在这里：本 action 会直接读 package.json 的 packageManager 字段，
      # 保持单一真相源（两处都写且不一致时它会直接报 Multiple versions 错）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .wxt/tsconfig.json 由 typecheck 脚本里的 `wxt prepare` 生成（含 @ 别名与 #imports 虚拟模块
      # 类型，vue-tsc 与 vitest 都依赖它）。不能单独提前跑：WXT 解析 @duoling/* 走 exports → dist，
      # 包还没构建时 resolve 必失败 —— 故它紧跟 `pnpm -r build`。
      - name: Typecheck (vue-tsc --noEmit)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm run test
