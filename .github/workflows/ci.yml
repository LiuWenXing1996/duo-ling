name: CI

# 唯一的工作流：门禁（注释 / 密钥）、类型检查、单测、端到端冒烟，串行跑在同一个 job 里。
# job 名 `Gate` 就是仓库 ruleset 绑定的必需检查（context 精确匹配）；
# 以后加检查项只改 package.json 的 ci 脚本，这个字符串不用动。
#
# 触发面：PR、push main、每日定时、手动。
on:
  workflow_dispatch:
  # 每日北京时间 02:00（UTC 18:00）全量跑一遍，抓产品级回归（如 CSP / 注入链路）
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [main]
  pull_request:

# 同一分支多次 push/更新 PR 时取消进行中的旧跑，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本不写在这里：本 action 会直接读 package.json 的 packageManager 字段，
      # 保持单一真相源（两处都写且不一致时它会直接报 Multiple versions 错）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 缓存 Playwright 浏览器二进制，避免每次重新下载。
      # GitHub 官方 runner 在海外，走 Playwright 官方 CDN 即可（稳定且快）；
      # 若改用国内自托管 runner，可加 env PLAYWRIGHT_DOWNLOAD_HOST=https://npmmirror.com/mirrors/playwright/
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # 浏览器与系统依赖属于环境准备，不进 npm 脚本：`--with-deps` 只在 Linux 上有意义
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # .wxt/tsconfig.json 由 typecheck / test 脚本里的 `wxt prepare` 生成（含 @ 别名与 #imports
      # 虚拟模块类型，vue-tsc 与 vitest(WxtVitest) 都依赖它）。此处不能提前单独跑：WXT 解析
      # @duoling/* 走 exports → dist，包未构建时 resolve 必失败 —— 故它内建在 typecheck / test
      # 里、紧跟 `pnpm -r build`；postinstall 同理不跑（install 期 dist 还不存在）。
      #
      # 门禁 → typecheck → 单测 → build → e2e 的顺序与内容见 package.json 的 ci 脚本。
      # pnpm 会逐条打印子命令，失败即停，日志里能直接看到挂在哪一步。
      - name: Run CI
        run: pnpm run ci
