name: CI

# PR 门禁：只跑快测（类型检查 + 单元测试），不碰 E2E。
# E2E 见 e2e.yml（独立 workflow，手动 / nightly / push main 触发）。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支多次 push/更新 PR 时取消进行中的旧跑，避免排队浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不传 version：pnpm/action-setup 读 package.json 的 packageManager 字段，
      # 版本只有一处真相源，避免 workflow 与本地各写一个版本号后漂移。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .wxt/tsconfig.json 由 wxt prepare 生成（含 @ 别名与 #imports 虚拟模块类型），vue-tsc 与 vitest(WxtVitest) 都依赖它；
      # 缺失报 "Failed to load tsconfig '.wxt/tsconfig.json'"；门禁不因缺 .wxt 假红——显式 prepare 兜底，防 postinstall 被跳过致 typecheck 假红。
      - name: Generate WXT types (.wxt/tsconfig.json)
        run: pnpm exec wxt prepare

      - name: Typecheck (vue-tsc --noEmit)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm run test
